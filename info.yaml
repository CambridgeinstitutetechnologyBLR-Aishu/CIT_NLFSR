project:
  title:        "PQC NLFSR"
  author:       "Aishu and Rishika"
  description:  "8-bit Non-Linear Feedback Shift Register for PQC"
  how_it_works: "Uses non-linear AND-gate feedback to generate complex sequences"
  how_to_test:  "Load seed via ui_in and uio[0], then set uio[1] high to run"
  language:     "Verilog"
  top_module:   "tt_um_nlfsr_pqc"
  yaml_version: 1
  tiles: "1x1"
  clock_hz: 10000000
  source_files:
    - "project.v"

pinout:
  ui[0]: "seed0"
  ui[1]: "seed1"
  ui[2]: "seed2"
  ui[3]: "seed3"
  ui[4]: "seed4"
  ui[5]: "seed5"
  ui[6]: "seed6"
  ui[7]: "seed7"
  uo[0]: "out0"
  uo[1]: "out1"
  uo[2]: "out2"
  uo[3]: "out3"
  uo[4]: "out4"
  uo[5]: "out5"
  uo[6]: "out6"
  uo[7]: "out7"
  uio[0]: "load"
  uio[1]: "enable"
