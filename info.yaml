project:
  title:        "PQC NLFSR"
  author:       "Aishu and Rishika"
  description:  "8-bit Non-Linear Feedback Shift Register for PQC"
  how_it_works: "Uses a non-linear feedback path with an AND gate between bits 1 and 0 to resist linear cryptanalysis."
  how_to_test:  "Set uio[0] high to load a seed from ui_in, then set uio[1] high to observe the NLFSR sequence on uo_out."
  language:     "Verilog"
  top_module:   "tt_um_nlfsr_pqc"
  yaml_version: 1
  tiles: "1x1"
  clock_hz: 10000000
  source_files:
    - "project.v"

pinout:
  ui[0]: "seed0"
  ui[1]: "seed1"
  ui[2]: "seed2"
  ui[3]: "seed3"
  ui[4]: "seed4"
  ui[5]: "seed5"
  ui[6]: "seed6"
  ui[7]: "seed7"
  uo[0]: "out0"
  uo[1]: "out1"
  uo[2]: "out2"
  uo[3]: "out3"
  uo[4]: "out4"
  uo[5]: "out5"
  uo[6]: "out6"
  uo[7]: "out7"
  uio[0]: "load"
  uio[1]: "enable"
  uio[2]: "unused"
  uio[3]: "unused"
  uio[4]: "unused"
  uio[5]: "unused"
  uio[6]: "unused"
  uio[7]: "unused"
